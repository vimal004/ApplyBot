<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApplyBot - Premium Enterprise Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Premium Monochromatic Theme */
            --bg-base: #070708;
            --bg-surface: rgba(18, 18, 22, 0.7);
            --bg-surface-lowest: #0a0a0c;
            --bg-surface-low: #111114;
            --bg-surface-high: #1a1a22;
            --bg-surface-highest: #22222b;
            
            --color-primary: #ffffff;
            --color-on-primary: #070708;
            --color-primary-container: rgba(255, 255, 255, 0.08);
            --color-on-primary-container: #f4f4f5;
            
            --color-text-primary: #f4f4f5;
            --color-text-secondary: #8e8e9f;
            --color-text-muted: #5c5c6d;
            
            --color-border: rgba(255, 255, 255, 0.06);
            --color-border-hover: rgba(255, 255, 255, 0.12);
            --color-error: #ff453a;
            --color-error-container: rgba(255, 69, 58, 0.1);

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-full: 9999px;
            
            --easing-standard: cubic-bezier(0.16, 1, 0.3, 1);
            --easing-expressive: cubic-bezier(0.1, 0.8, 0.1, 1);
            --duration-short: 150ms;
            --duration-medium: 300ms;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-base);
            color: var(--color-text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(at 0% 0%, rgba(255, 255, 255, 0.03) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 255, 255, 0.01) 0px, transparent 50%);
        }

        header {
            padding: 1.25rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(7, 7, 8, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 50;
            border-bottom: 1px solid var(--color-border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            background: var(--color-primary);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.1rem;
            color: var(--color-on-primary);
        }

        .brand-text-group {
            display: flex;
            flex-direction: column;
        }

        .brand-title {
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: -0.02em;
            color: #ffffff;
        }

        .brand-sub {
            font-size: 0.7rem;
            color: var(--color-text-secondary);
            font-weight: 500;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .candidate-badge {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--color-border);
            padding: 0.45rem 1rem;
            border-radius: var(--radius-full);
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--color-text-primary);
            display: flex;
            align-items: center;
            gap: 0.55rem;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: var(--color-text-secondary);
            border-radius: 50%;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 3rem 2rem;
            width: 100%;
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2.5rem;
        }

        @media (max-width: 960px) {
            .container {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
        }

        .card {
            background: var(--bg-surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: 1.75rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            transition: border-color var(--duration-medium) var(--easing-standard);
        }

        .card:hover {
            border-color: var(--color-border-hover);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 0.85rem;
            border-bottom: 1px solid var(--color-border);
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #ffffff;
            letter-spacing: -0.01em;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            color: var(--color-text-secondary);
        }

        .mode-selector {
            display: flex;
            background: rgba(0, 0, 0, 0.2);
            padding: 3px;
            border-radius: var(--radius-full);
            border: 1px solid var(--color-border);
        }

        .mode-btn {
            padding: 5px 12px;
            border-radius: var(--radius-full);
            border: none;
            background: transparent;
            color: var(--color-text-secondary);
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--duration-short) var(--easing-standard);
        }

        .mode-btn.active {
            background: var(--color-primary);
            color: var(--color-on-primary);
        }

        textarea {
            width: 100%;
            height: 220px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: 1.1rem;
            color: var(--color-text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            resize: vertical;
            outline: none;
            transition: border-color var(--duration-short) var(--easing-standard);
        }

        textarea:focus {
            border-color: var(--color-border-hover);
        }

        textarea::placeholder {
            color: var(--color-text-muted);
        }

        .sample-section {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .sample-label {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .sample-btns {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .btn-sample {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--color-border);
            color: var(--color-text-secondary);
            padding: 0.45rem 0.85rem;
            border-radius: var(--radius-full);
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--duration-short) var(--easing-standard);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-sample:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #ffffff;
            border-color: var(--color-border-hover);
        }

        .btn-primary {
            background: var(--color-primary);
            color: var(--color-on-primary);
            border: none;
            padding: 0.9rem 1.6rem;
            border-radius: var(--radius-full);
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all var(--duration-short) var(--easing-standard);
        }

        .btn-primary:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .job-details-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
        }

        .info-pill {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--color-border);
            padding: 0.65rem 0.9rem;
            border-radius: var(--radius-md);
        }

        .info-label {
            font-size: 0.65rem;
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 0.25rem;
            font-weight: 700;
        }

        .info-value {
            font-size: 0.88rem;
            font-weight: 600;
            color: #ffffff;
        }

        .ats-meter {
            background: rgba(0, 0, 0, 0.15);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: 1.1rem;
            display: flex;
            align-items: center;
            gap: 1.25rem;
        }

        .ats-score-circle {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: conic-gradient(var(--color-primary) var(--score-pct, 85%), rgba(255,255,255,0.06) 0);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1rem;
            position: relative;
            flex-shrink: 0;
        }

        .ats-score-circle::after {
            content: '';
            position: absolute;
            width: 42px;
            height: 42px;
            background: var(--bg-surface-lowest);
            border-radius: 50%;
        }

        .ats-score-text {
            position: relative;
            z-index: 2;
            color: #ffffff;
        }

        .action-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        .profile-table {
            width: 100%;
            font-size: 0.8rem;
            border-collapse: collapse;
            margin-top: 0.5rem;
        }

        .profile-table td {
            padding: 0.45rem 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .profile-table td:first-child {
            color: var(--color-text-secondary);
            font-weight: 500;
            width: 35%;
        }

        .profile-table td:last-child {
            color: var(--color-text-primary);
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 1rem;
            color: var(--color-text-muted);
            font-size: 0.88rem;
            line-height: 1.6;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            border-top-color: #000;
            animation: spin 0.8s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .chip-badge {
            background: rgba(255, 255, 255, 0.06);
            color: #ffffff;
            border: 1px solid var(--color-border);
            padding: 4px 10px;
            border-radius: var(--radius-full);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .chip-badge-warn {
            background: var(--color-error-container);
            color: #ff453a;
            border: 1px solid rgba(255, 69, 58, 0.2);
            padding: 4px 10px;
            border-radius: var(--radius-full);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <div class="brand-icon">⚡</div>
            <div class="brand-text-group">
                <div class="brand-title">ApplyBot</div>
                <div class="brand-sub">Enterprise Ingestion Suite</div>
            </div>
        </div>
        <div class="candidate-badge">
            <div class="status-dot"></div>
            <span>Vimal Manoharan (2026 CSE)</span>
        </div>
    </header>

    <div class="container">
        <!-- Left Column: Telegram Ingest -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">
                    <span>📩 Telegram Referral Ingestion</span>
                </div>
                <div class="mode-selector">
                    <button class="mode-btn active" id="btn-mode-manual" onclick="setMode('MANUAL_REVIEW')">Manual Review</button>
                    <button class="mode-btn" id="btn-mode-superfast" onclick="setMode('SUPERFAST_AUTO')">Superfast</button>
                </div>
            </div>

            <textarea id="telegram-input" placeholder="Paste referral message from Telegram (e.g., SDE Premium Referrals 2.0)..."></textarea>

            <div class="sample-section">
                <span class="sample-label">Try Scenario Templates:</span>
                <div class="sample-btns">
                    <button class="btn-sample" onclick="loadSample(1)">Resilience AI (HR Email)</button>
                    <button class="btn-sample" onclick="loadSample(2)">Open Futures (HR Email)</button>
                    <button class="btn-sample" onclick="loadSample(3)">UnifyApps (Google Form)</button>
                </div>
            </div>

            <button class="btn-primary" onclick="processPost()">
                <span id="btn-text">Run ApplyBot Pipeline</span>
            </button>
        </div>

        <!-- Right Column: Results & Actions -->
        <div class="card" id="output-card">
            <div class="card-header">
                <div class="card-title">
                    <span>📊 Optimization Report</span>
                </div>
                <div id="eligibility-badge"></div>
            </div>

            <div id="output-content">
                <div class="empty-state">
                    Paste a Telegram post on the left and click <b>Run ApplyBot Pipeline</b> to generate tailored ATS resumes, HR emails, and auto-fill scripts.
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'MANUAL_REVIEW';
        let currentPayload = null;

        const sample1 = `🚨 Referral Alert 🚨Company - Resilience AIRole - AI/ML InternBatch - 2025/2026/2027Stipend - ₹30,000/monthLocation - Remote (India)How to Apply:Email: builders@resilience360.aiSubject: AIML Intern-<Full Name> - <Project No> - <Your Fav Animal>`;

        const sample2 = `🚨 Referral Alert 🚨
Company - Open Futures Group
Role - Quantitative Researcher
Batch - 2023, 2024, and 2025
CTC - 40-70 LPA
Location - Gurgaon
How to Apply:
hiring@openfutures.co.in`;

        const sample3 = `🚨 Referral Alert 🚨
Company - UnifyApps
Role - Full-Stack Development Software Engineer (FDSE)
Batch - 2024/2025
CTC - 20-35 LPA
Location - Gurgaon
How to Apply:
https://docs.google.com/forms/d/e/1FAIpQLSe4NB9S6OaQLNuQz5TPSezS8YcoUE_7P4KwYadPZ9S0zljgOA/viewform`;

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btn-mode-manual').classList.toggle('active', mode === 'MANUAL_REVIEW');
            document.getElementById('btn-mode-superfast').classList.toggle('active', mode === 'SUPERFAST_AUTO');
        }

        function loadSample(num) {
            if (num === 1) document.getElementById('telegram-input').value = sample1;
            if (num === 2) document.getElementById('telegram-input').value = sample2;
            if (num === 3) document.getElementById('telegram-input').value = sample3;
        }

        async function processPost() {
            const rawText = document.getElementById('telegram-input').value.trim();
            if (!rawText) {
                alert('Please paste a Telegram referral message.');
                return;
            }

            const btnText = document.getElementById('btn-text');
            btnText.innerHTML = '<div class="spinner"></div> Running Groq LLM & ATS Engine...';

            try {
                const response = await fetch('/api/process', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        raw_text: rawText,
                        superfast_mode: currentMode === 'SUPERFAST_AUTO'
                    })
                });

                const data = await response.json();
                renderReport(data);
            } catch (err) {
                alert('Error processing request: ' + err);
            } finally {
                btnText.innerText = 'Run ApplyBot Pipeline';
            }
        }

        async function triggerSendEmail() {
            if (!currentPayload) return;
            const btn = document.getElementById('btn-send-email');
            btn.innerHTML = '<div class="spinner"></div> Sending Email...';
            btn.disabled = true;

            try {
                const response = await fetch('/api/send_email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(currentPayload)
                });

                const result = await response.json();
                if (result.success) {
                    alert('✅ SUCCESS: ' + result.message);
                    btn.innerHTML = '✅ Email Sent!';
                    btn.style.background = 'rgba(255,255,255,0.06)';
                    btn.style.color = '#ffffff';
                    btn.style.borderColor = 'var(--color-border)';
                } else {
                    alert('❌ FAILED: ' + result.message);
                    btn.innerHTML = 'Send Email Now';
                    btn.disabled = false;
                }
            } catch (err) {
                alert('Error sending email: ' + err);
                btn.innerHTML = 'Send Email Now';
                btn.disabled = false;
            }
        }

        async function triggerAutoFill() {
            if (!currentPayload) return;
            const btn = document.getElementById('btn-autofill');
            btn.innerHTML = '<div class="spinner"></div> Inspecting DOM & Launching Playwright...';
            btn.disabled = true;

            try {
                const response = await fetch('/api/autofill_form', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(currentPayload)
                });

                const result = await response.json();
                alert('⚡ ' + result.message);
                btn.innerHTML = 'Form Auto-Filled (Browser Opened)';
                btn.style.background = 'rgba(255,255,255,0.06)';
                btn.style.color = '#ffffff';
                btn.style.borderColor = 'var(--color-border)';
            } catch (err) {
                alert('Error launching auto-filler: ' + err);
                btn.innerHTML = 'Launch Playwright & Auto-Fill Form';
                btn.disabled = false;
            }
        }

        function renderReport(data) {
            const container = document.getElementById('output-content');

            if (data.error) {
                document.getElementById('eligibility-badge').innerHTML = '';
                container.innerHTML = `
                    <div style="background: var(--color-error-container); border: 1px solid var(--color-error); border-radius: var(--radius-md); padding: 1.25rem; color: #ffffff;">
                        <strong style="color: var(--color-error); font-size: 0.95rem;">⚠️ Unable to Process Referral Message</strong>
                        <p style="margin-top: 0.5rem; font-size: 0.85rem; color: var(--color-text-secondary);">${data.error}</p>
                    </div>
                `;
                return;
            }

            const job = data.job;
            const action = data.action_result;
            const pdfFilename = data.pdf_path.split('/').pop();
            const pdfDownloadUrl = `/outputs/${pdfFilename}`;

            const isEligible = job.is_eligible;
            const badgeHtml = isEligible 
                ? `<span class="chip-badge">✅ ELIGIBLE (${job.batch})</span>`
                : `<span class="chip-badge-warn">⚠️ BATCH CHECK (${job.batch})</span>`;

            document.getElementById('eligibility-badge').innerHTML = badgeHtml;

            let actionContentHtml = '';

            if (action.type === 'EMAIL') {
                currentPayload = action.payload;
                actionContentHtml = `
                    <div class="action-box">
                        <div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 0.25rem;">
                            <strong style="color: #ffffff; font-size: 0.9rem;">📧 Recruiter Email Proposal</strong>
                            <span style="font-size: 0.78rem; color: var(--color-text-secondary);">${currentPayload.to_email}</span>
                        </div>
                        <div style="font-weight: 500; font-size: 0.82rem; color: var(--color-text-secondary);">Subject: <span style="color:#ffffff;">${currentPayload.subject}</span></div>
                        <div style="background: rgba(0,0,0,0.2); padding: 1rem; border-radius: var(--radius-md); font-size: 0.82rem; white-space: pre-line; border: 1px solid var(--color-border); max-height: 180px; overflow-y: auto; color: #cbd5e1; font-family:'JetBrains Mono', monospace; line-height:1.5;">
                            ${currentPayload.body}
                        </div>
                        <div style="background: rgba(255, 255, 255, 0.01); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 0.65rem 0.85rem; font-size: 0.78rem; color: var(--color-text-secondary); line-height: 1.5;">
                            💡 <strong>Direct Attachment Guidance:</strong> Web browsers prevent external URLs from pre-attaching local files. Click <strong>Send Email Now</strong> to automatically attach & send the tailored PDF resume via Gmail SMTP.
                        </div>
                        <div style="display: flex; gap: 0.6rem; justify-content: space-between; align-items: center; margin-top: 0.5rem; flex-wrap: wrap;">
                            <a href="${pdfDownloadUrl}" target="_blank" class="btn-sample" style="border-color: #ffffff; color: #ffffff;">
                                📄 Download Tailored PDF Resume
                            </a>
                            <div style="display: flex; gap: 0.5rem;">
                                <a href="${currentPayload.gmail_compose_url}" target="_blank" class="btn-sample" style="background: rgba(255, 255, 255, 0.04); border-color: var(--color-border); color: #fff;">
                                    Compose in Gmail Web
                                </a>
                                <button id="btn-send-email" class="btn-sample" style="background: #ffffff; color: #000; font-weight: 700; padding: 0.55rem 1.1rem; border-color: #ffffff;" onclick="triggerSendEmail()">
                                    Send Email Now
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                currentPayload = action.payload;
                const p = currentPayload.profile;

                actionContentHtml = `
                    <div class="action-box">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <strong style="color: #ffffff; font-size: 0.9rem;">🌐 Web Portal Form Auto-Fill Mapping</strong>
                            <span style="font-size: 0.78rem; color: var(--color-text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 250px;">${currentPayload.apply_url}</span>
                        </div>
                        
                        <table class="profile-table">
                            <tr><td>Full Name:</td><td>${p.full_name}</td></tr>
                            <tr><td>Email Address:</td><td>${p.email}</td></tr>
                            <tr><td>Phone Number:</td><td>${p.phone}</td></tr>
                            <tr><td>University / CGPA:</td><td>${p.university} (${p.cgpa})</td></tr>
                            <tr><td>Graduation Year:</td><td>${p.graduation_year}</td></tr>
                            <tr><td>LinkedIn / GitHub:</td><td>${p.linkedin}</td></tr>
                        </table>

                        <div style="display: flex; gap: 0.6rem; justify-content: space-between; align-items: center; margin-top: 0.5rem; flex-wrap: wrap;">
                            <a href="${pdfDownloadUrl}" target="_blank" class="btn-sample" style="border-color: #ffffff; color: #ffffff;">
                                📄 Download Tailored PDF Resume
                            </a>
                            <button id="btn-autofill" class="btn-sample" style="background: #ffffff; color: #000; font-weight: 700; padding: 0.55rem 1.1rem; border-color: #ffffff;" onclick="triggerAutoFill()">
                                Launch Playwright Fill
                            </button>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="job-details-grid">
                    <div class="info-pill">
                        <div class="info-label">Company</div>
                        <div class="info-value">${job.company}</div>
                    </div>
                    <div class="info-pill">
                        <div class="info-label">Role</div>
                        <div class="info-value">${job.role}</div>
                    </div>
                    <div class="info-pill">
                        <div class="info-label">Salary / Stipend</div>
                        <div class="info-value">${job.salary}</div>
                    </div>
                    <div class="info-pill">
                        <div class="info-label">Location</div>
                        <div class="info-value">${job.location}</div>
                    </div>
                </div>

                <div class="ats-meter" style="--score-pct: ${data.ats_score}%">
                    <div class="ats-score-circle">
                        <span class="ats-score-text">${data.ats_score}%</span>
                    </div>
                    <div>
                        <div style="font-weight: 600; font-size: 0.92rem; color: #ffffff; letter-spacing:0.02em;">ATS Optimization Score</div>
                        <div style="font-size: 0.8rem; color: var(--color-text-secondary); margin-top: 0.25rem; line-height:1.4;">
                            Target keywords integrated: <span style="color: #ffffff; font-weight:600;">${data.found_keywords.join(', ')}</span>
                        </div>
                    </div>
                </div>

                ${actionContentHtml}
            `;
        }
    </script>
</body>
</html>
